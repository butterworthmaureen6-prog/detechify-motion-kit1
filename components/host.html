<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--TITLE--></title>
<style>
  html, body { margin: 0; height: 100%; background: #05070b; color: #cfd8e6; font-family: "Inter", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #wrap { display: flex; flex-direction: column; height: 100%; align-items: center; justify-content: center; }
  #stage { position: relative; background: #0a0f1a; overflow: hidden; box-shadow: 0 0 0 1px #1b2433; }
  canvas { width: 100%; height: 100%; display: block; }
  #vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }

  /* ---- transcript text layer ---- */
  #text { position: absolute; inset: 0; pointer-events: none; }
  #caps { position: absolute; left: 5%; right: 5%; bottom: 8%; text-align: center; opacity: 0; transition: opacity .15s; }
  #caps.on { opacity: 1; }
  #caps .box { display: inline-block; padding: .3em .75em; border-radius: .6em; background: rgba(8,12,20,.5); backdrop-filter: blur(6px);
               font-weight: 700; font-size: 1.9em; line-height: 1.25; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  #caps .w { color: #fff; opacity: .4; transition: opacity .1s, color .1s; }
  #caps .w.past { opacity: 1; }
  #caps .w.now { opacity: 1; color: #ff8a2b; }
  #stage[data-format="9x16"] #caps { bottom: 24%; }
  #stage[data-format="9x16"] #caps .box { font-size: 1.55em; }

  #kw { position: absolute; left: 5%; top: 9%; display: flex; flex-direction: column; gap: .6em; align-items: flex-start; }
  #stage[data-format="9x16"] #kw { left: 6%; right: 6%; top: 10%; align-items: stretch; }
  .kwcard { display: none; position: relative; padding: .7em 1.2em .75em 1.4em; border-radius: .9em; background: rgba(20,32,52,.58);
            border: 1px solid rgba(120,170,220,.35); backdrop-filter: blur(8px); }
  .kwcard.on { display: block; animation: kwin .4s cubic-bezier(.2,.8,.2,1); }
  .kwcard::before { content: ""; position: absolute; left: .5em; top: .7em; bottom: .7em; width: .22em; border-radius: .2em; background: #ff8a2b; }
  .kwcard .k { font-size: 2.4em; font-weight: 800; line-height: 1.05; color: #fff; letter-spacing: -.01em; }
  .kwcard .s { margin-top: .25em; font-size: .95em; color: #8fb4dc; letter-spacing: .02em; }
  #stage[data-format="9x16"] .kwcard .k { font-size: 2em; }
  @keyframes kwin { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }

  #labels { position: absolute; inset: 0; }
  #labels svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #labels .dot { position: absolute; width: .7em; height: .7em; margin: -.35em 0 0 -.35em; border-radius: 50%; opacity: 0; transition: opacity .25s; }
  #labels .pill { position: absolute; padding: .22em .75em; border-radius: 999px; background: rgba(12,20,34,.78); border: 1.5px solid; color: #e8f1fb;
                  font-size: .95em; font-weight: 600; white-space: nowrap; opacity: 0; transition: opacity .25s; backdrop-filter: blur(4px); }
  #labels .on { opacity: 1; }
  #stage[data-format="9x16"] #labels .pill { font-size: 1.05em; }

  #bar { height: 52px; display: flex; gap: 10px; align-items: center; }
  button { background: #1b2433; color: #cfd8e6; border: 1px solid #2d3a50; border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
  button:hover { background: #26324a; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="vig"></div>
    <div id="text">
      <div id="kw"></div>
      <div id="labels"><svg></svg></div>
      <div id="caps"><span class="box"></span></div>
    </div>
  </div>
  <div id="bar"><button id="play">Pause</button><button id="fmt">Switch to 9:16</button><button id="txt">Text: on</button></div>
</div>
<!--BUNDLE-->
</body>
</html>
